# CyberRakshak Windows Agent configuration
#
# Every setting can also be provided as an environment variable using the
# CYBERRAKSHAK_* prefix (e.g. CYBERRAKSHAK_API_TOKEN, CYBERRAKSHAK_SERVER_URL).
# Env vars override this file.

agent_id: "WIN-AGT-0001"
unit_id: null                # optional: server re-associates if omitted
hostname: null               # defaults to socket hostname

server_url: "http://localhost:8000"
api_token: ""                # REQUIRED — paste token from web UI agent registration
verify_ssl: true

# Windows Event Log channels to monitor
channels:
  - "Security"
  - "System"
  - "Application"

# Collection
poll_interval_seconds: 5.0
lookback_seconds: 300        # backfill window on first start
max_batch: 200
include_raw_xml: true
event_id_filter: []          # empty = all; e.g. [4624, 4625, 4688, 1102, 7045]

# Local spool (offline buffer while the server is unreachable)
spool_dir: "spool"
spool_max_mb: 512

# Non-Windows development mode: emit synthetic Windows-style events
simulate: true
simulated_rate: 2.0
