services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberrakshak-db
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_password
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberrakshak-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel_dev_password@postgres:5432/sentinel
      APP_ENV: docker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberrakshak-seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel_dev_password@postgres:5432/sentinel
      APP_ENV: docker
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["python", "-m", "app.seed.seed_all"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: cyberrakshak-ui
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
