# OPTIONAL full-stack for the Criminal Intelligence graph.
#
# The platform runs with zero infrastructure by default (SQLite + relational
# graph store). Start this if you want:
#   - a Postgres database:  docker compose up -d db
#   - a Neo4j-backed graph: docker compose up -d db neo4j
#         then set GRAPH_BACKEND=neo4j, NEO4J_URI=bolt://localhost:7687,
#         NEO4J_PASSWORD=sentinel-demo on the backend.
#   - an OSINT data feed:   docker compose up -d db osint-service
#         clone the external aggregator as a SIBLING of this repo:
#             git clone https://github.com/Dev9269/vajra-osint.git ..
#         then point the backend at it (any api/key, but both must match):
#             OSINT_API_URL=http://osint-service:8000
#             OSINT_API_KEY=<same key as VAJRA_API_KEY below>
#         Set VAJRA_API_KEY in your shell (defaults to osint-demo-key).
#
# The relational GraphStore remains the default and never requires this file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel-demo
      POSTGRES_DB: sentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/sentinel-demo
    volumes:
      - neo4jdata:/data

  # External VAJRA OSINT aggregator — consumed read-only as another data
  # source. Builds the upstream repo as-is (no files modified inside it);
  # the Dockerfile lives in this repo at docker/osint/Dockerfile.
  osint-service:
    build:
      context: ..
      dockerfile: crpf-sentinel/docker/osint/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      VAJRA_API_KEY: ${VAJRA_API_KEY:-osint-demo-key}
      VAJRA_CORS_ORIGINS: ${VAJRA_CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
    volumes:
      - osintdata:/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4jdata:
  osintdata: